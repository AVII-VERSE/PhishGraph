name: Feature Request
description: Suggest an idea or analyzer enhancement for PhishGraph
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggesting an enhancement for PhishGraph (e.g. new threat-intel feed, detection heuristic, UI command).
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What challenge does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
