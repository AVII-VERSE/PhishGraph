name: PhishGraph CI

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Black Formatter Check
        run: |
          black --check .

  test:
    name: Pytest Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]

    env:
      APP_ENV: testing
      DATABASE_URL: sqlite+aiosqlite:///./test_phishgraph.db
      HTTP_TIMEOUT_SECONDS: 3.0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Dependencies for OpenCV and ReportLab
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-glx libglib2.0-0

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Suite
        run: |
          pytest -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: phishgraph:latest
