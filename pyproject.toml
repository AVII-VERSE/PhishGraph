[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishgraph"
version = "0.1.0"
description = "Phishing Infrastructure & Campaign Intelligence Telegram Bot"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PhishGraph Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.0",
    "cryptography>=43.0.0",
    "python-telegram-bot>=21.4",
    "mmh3>=5.0.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
